name: Verify release candidate

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-history:
    name: Secret history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend contracts and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Setup Python for cross-runtime contracts
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          npm ci
          pip install -r backend/requirements.txt
      - name: Verify encoding and session boundaries
        run: |
          npm run encoding:scan
          npm run session:verify
      - name: Run frontend contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*.test.mjs; do
            node "$test_file"
          done
      - name: Build production frontend
        run: npm run build
      - name: Verify bundle budget
        run: npm run bundle:verify

  backend:
    name: Backend full verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: t22_test
          POSTGRES_USER: t22_test
          POSTGRES_PASSWORD: t22_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t22_test -d t22_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      T22_TEST_POSTGRES_URL: postgresql+psycopg://t22_test:t22_test_password@127.0.0.1:5432/t22_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run complete backend verification
        run: python scripts/verify_all.py
